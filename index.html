<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>派遣前台灣華語研修</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#EFE9DF; --card:#F8F4EC; --ink:#2B1D1A; --muted:#8C7B70; --line:#D6CCBD; --num:#C9BBA8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;display:flex;flex-direction:column;
  background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Hiragino Sans",sans-serif;
}
header{text-align:center;padding:64px 24px 60px}
h1{
  margin:0;font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;
  font-weight:900;font-size:clamp(30px,5vw,50px);letter-spacing:.1em;line-height:1.2;
}
main{flex:1;width:100%;max-width:1200px;margin:0 auto;padding:0 28px 40px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.tile{
  display:flex;flex-direction:column;justify-content:center;gap:8px;height:124px;
  padding:18px 20px;background:var(--card);border:1px solid var(--line);border-radius:2px;
  color:inherit;text-decoration:none;
  transition:transform .15s,box-shadow .15s,border-color .15s;
}
.tile:hover{border-color:var(--ink);transform:translate(-3px,-3px);box-shadow:3px 3px 0 var(--ink)}
.tile:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.tile b{font-size:20px;font-weight:700;letter-spacing:.04em}
.tile span{font-size:14px;font-weight:300;letter-spacing:.08em;color:var(--muted)}
@media (max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:560px){.grid{grid-template-columns:repeat(2,1fr)}}
footer{text-align:center;padding:24px 24px 32px;font-size:12px;letter-spacing:.06em;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.tile{transition:none}}
</style>
</head>
<body>
<header><h1>派遣前台灣華語研修</h1></header>
<main>
  <div class="grid" id="grid"></div>
</main>
<footer>Shelleytaiwan 製作 · 2027 · 請勿商用</footer>
<script>
// 新增模塊：在下面加一行 {name, desc, url, external}。external:true = 新分頁開啟（外部網站）
const tools = [
  {name:"漢語拼音表", desc:"YoYo Chinese 外部連結", url:"https://yoyochinese.com/chinese-learning-tools/Mandarin-Chinese-pronunciation-lesson/pinyin-chart-table", external:true},
  {name:"課堂用語", desc:"課堂常用語練習", url:"https://shelleytaiwan.github.io/classroom-language/"},
  {name:"時代華語短文跟讀", desc:"16 課課文朗讀", url:"https://claude.ai/artifact/UpkJLHTYQ2LU6Kbs95hxgi"},
  {name:"詞語複習", desc:"405 個詞語・跑馬燈練習", url:"https://shelleytaiwan.github.io/vocab-marquee/"},
  {name:"快速問答", desc:"聽題目・AI 陪練", url:"https://shelleytaiwan.github.io/quick-qa/"}
];
const grid = document.getElementById("grid");
tools.forEach(t=>{
  const a=document.createElement("a");
  a.className="tile";a.href=t.url;
  if(t.external){a.target="_blank";a.rel="noopener noreferrer";}
  const b=document.createElement("b");b.textContent=t.name;
  const s=document.createElement("span");s.textContent=t.desc;
  a.append(b,s);grid.append(a);
});
</script>
</body>
</html>
